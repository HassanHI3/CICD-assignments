name: python /cd workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          cd chapter1
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 891377356090.dkr.ecr.eu-west-2.amazonaws.com

      - name: Build Docker image
        run: |
          cd chapter1
          docker buildx build --platform linux/amd64 -t my-app --load .

      - name: Tag Docker image
        run: |
          docker tag my-app:latest 891377356090.dkr.ecr.eu-west-2.amazonaws.com/my-app:latest

      - name: Push Docker image
        run: |
          docker push 891377356090.dkr.ecr.eu-west-2.amazonaws.com/my-app:latest

      - name: set up terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: initialize terraform
        run: |
          cd chapter1
          terraform init

      - name: terraform validate
        run: |
          cd chapter1
          terraform validate

      - name: terraform plan
        run: |
          cd chapter1
          terraform plan -out=tfplan

      - name: terraform apply
        run: |
          cd chapter1
          terraform apply -auto-approve tfplan

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster white-hart \
            --service my-app \
            --force-new-deployment \
            --region eu-west-2